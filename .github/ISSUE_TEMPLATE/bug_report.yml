name: Bug 报告 / Bug Report
description: 报告可复现的问题，帮助我们改进 Open EHR Mobile
title: "[Bug] "
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 Open EHR Mobile。请勿提交真实员工信息、账号、访问凭据、内部地址或其他敏感数据。

  - type: input
    id: affected-route
    attributes:
      label: 受影响路由 / Affected Route
      description: 请填写发生问题的页面路由。
      placeholder: 例如：/approval/detail/todo-001
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 请填写操作系统、浏览器、Node.js 版本和项目提交版本。
      placeholder: 例如：Windows 11、Chrome 138、Node.js 22、commit abc1234
    validations:
      required: true

  - type: dropdown
    id: viewport
    attributes:
      label: 视口宽度 / Viewport
      description: 请选择最接近问题发生时的移动端视口宽度。
      options:
        - 375px
        - 390px
        - 430px
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: 问题描述 / Description
      description: 请简要说明发生了什么，以及问题对使用流程的影响。
      placeholder: 清晰描述问题现象和影响范围。
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 复现步骤 / Steps to Reproduce
      description: 请提供可以稳定复现问题的最小步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 输入……
        4. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期结果 / Expected Behavior
      placeholder: 说明你期望看到的正确行为。
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际结果 / Actual Behavior
      placeholder: 说明实际发生的行为，可附不含敏感信息的错误日志。
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或补充信息 / Screenshots or Additional Context
      description: 可拖入脱敏后的截图、控制台错误或 smoke 输出摘要。
      placeholder: 请先删除姓名、手机号、邮箱、组织名称、Token 和内部地址等敏感信息。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认 / Checklist
      options:
        - label: 我已搜索现有 Issue，确认没有内容相同的报告。
          required: true
        - label: 我已尽量在最新的 main 分支复现该问题。
          required: true
        - label: 我确认提交内容不包含真实员工数据、访问凭据或其他敏感信息。
          required: true

name: 功能建议 / Feature Request
description: 提议适合移动端 HR 自助与审批模板的新能力或改进
title: "[Feature] "
labels:
  - enhancement
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。Open EHR Mobile 当前定位为 Vue 3 + TypeScript 的纯前端 Mock 模板，请优先描述用户价值、交互流程和可验证的前端范围。

  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题 / Problem
      description: 请说明目标用户、使用场景和当前痛点，不要只描述一个技术实现。
      placeholder: 例如：审批人需要在移动端快速识别即将超时的待办事项……
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 建议方案 / Proposed Solution
      description: 请描述期望的页面、交互或数据展示方式。
      placeholder: 说明核心流程、入口、主要状态和预期结果。
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围 / Scope
      description: 请选择最接近的功能范围。
      options:
        - 首页 / Home
        - 申请中心 / Apply
        - 审批流程 / Approval
        - 员工自助 / Self-service
        - 公共组件或样式 / Shared UI
        - Mock 数据或状态 / Mock Data
        - 文档或开发体验 / Documentation or DX
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: user-value
    attributes:
      label: 用户价值 / User Value
      description: 请说明该建议会改善什么，以及如何判断它有效。
      placeholder: 例如：减少审批人查找高优先级待办的时间，并可通过明确的状态标识进行验证。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案 / Alternatives
      description: 如果考虑过其他实现方式，请说明取舍；没有可填写“无”。
      placeholder: 说明替代方案及未采用原因。

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息 / Additional Context
      description: 可提供脱敏后的草图、参考链接或交互说明。
      placeholder: 请勿粘贴真实员工信息、内部系统截图、访问凭据或生产环境地址。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认 / Checklist
      options:
        - label: 我已搜索现有 Issue，确认没有内容相同的建议。
          required: true
        - label: 该建议符合纯前端、Mock 数据、移动端 HR 自助与审批模板的项目边界。
          required: true
        - label: 我确认提交内容不包含真实员工数据、访问凭据或其他敏感信息。
          required: true
